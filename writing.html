<script>
  // Archive = this list plus whatever /api/writing returns (newest posts from both feeds), de-duplicated.
  // Feeds only carry recent posts, so this list keeps older pieces on the page for good.
  var ARCHIVE = [
    { title: 'Don’t just drive by the rearview mirror: 12 leading indicators for design delivery', url: 'https://aerathe.substack.com/p/dont-just-drive-by-the-rearview-mirror', source: 'Substack', date: '2026-07-12', topic: 'Delivery and commercials', excerpt: 'The rearview mirror is useful. You need it. But you wouldn’t drive using only that view.' },
    { title: 'The ironies of automation', url: 'https://aerathe.substack.com/p/the-ironies-of-automation', source: 'Substack', date: '2026-07-10', topic: 'Delivery and commercials', excerpt: 'Why “Use AI, make this faster” isn’t a binary argument for compressing timelines.' },
    { title: 'Why smart people don’t resist change. They grieve it.', url: 'https://aerathe.substack.com/p/why-smart-people-dont-resist-change', source: 'Substack', date: '2026-05-29', topic: 'Program leadership', excerpt: 'When people struggle with AI-driven change, they’re not always resisting the future.' },
    { title: 'The hidden cost of holding things together', url: 'https://aerathe.substack.com/p/the-hidden-cost-of-holding-things', source: 'Substack', date: '2026-05-28', topic: 'Program leadership', excerpt: 'Making operational reality visible isn’t defeatism, nor failure of commitment.' },
    { title: 'On discernment, people, and the systems we navigate', url: 'https://aerathe.substack.com/p/on-discernment-people-and-the-systems', source: 'Substack', date: '2026-05-24', topic: 'Essays', excerpt: 'I’ve been thinking about pattern recognition lately—not in products or processes, but in people.' },
    { title: 'The epidemic of nonchalance. When did caring become lame?', url: 'https://aerathe.medium.com/the-epidemic-of-nonchalance-when-did-caring-become-lame-643d2c8aafb3', source: 'Medium', date: '2026-04-13', topic: 'Essays', excerpt: 'Somewhere along the way, caring became uncool. You don’t just feel indifferent — you show it.' },
    { title: 'How I actually define project success as a design program manager', url: 'https://aerathe.medium.com/how-i-actually-define-project-success-as-a-design-program-manager-bcd702e311fe', source: 'Medium', date: '2026-04-01', topic: 'Program leadership', excerpt: 'There is a question that comes up in every senior DPM interview, every programme retrospective…' },
    { title: 'Risk tolerance disagreements and the frameworks that resolve them', url: 'https://aerathe.medium.com/risk-tolerance-disagreements-and-the-frameworks-that-resolve-them-f559f32de32b', source: 'Medium', date: '2026-03-16', topic: 'Program leadership', excerpt: 'Cross-functional disagreements come in three types: facts, values, or risk tolerance.' },
    { title: '5 mental models behind strong program leadership, and how to apply them', url: 'https://aerathe.medium.com/5-mental-models-behind-strong-program-leadership-and-how-to-apply-them-918ed084f705', source: 'Medium', date: '2026-03-15', topic: 'Program leadership', excerpt: 'I used to approach program problems by trying to find the right answer quickly.' },
    { title: '28 UX operational metrics that changed how I run design programs', url: 'https://aerathe.medium.com/28-metrics-that-changed-how-i-run-design-programs-and-the-framework-behind-them-2380f7868465', source: 'Medium', date: '2026-03-14', topic: 'Delivery and commercials', excerpt: 'Why most design teams measure the wrong things, and what to do instead.' },
    { title: 'Is obedience slavery?', url: 'https://aerathe.medium.com/is-obedience-slavery-56cfe15461df', source: 'Medium', date: '2026-03-03', topic: 'Essays', excerpt: 'You, human, are a complex dynamic system, and therefore inherently unpredictable.' },
    { title: 'The most underrated strategic skill in meetings: summarisation', url: 'https://aerathe.medium.com/the-most-underrated-strategic-skill-in-meetings-summarisation-e23082fb7f27', source: 'Medium', date: '2026-03-02', topic: 'Program leadership', excerpt: 'Over the past few months, I’ve been deliberately experimenting with something surprisingly simple…' },
    { title: 'Agency POV: how perception around iterations affects negotiations, margins and team pressure', url: 'https://aerathe.medium.com/agency-pov-how-perception-around-iterations-affect-negotiations-margins-and-team-pressure-in-6de458fb8f8d', source: 'Medium', date: '2026-02-25', topic: 'Delivery and commercials', excerpt: 'I’ve been noticing a recurring pattern across agency projects.' },
    { title: 'Fixed-bid rewards discipline. It punishes ambiguity.', url: 'https://aerathe.medium.com/fixed-bid-rewards-discipline-it-punishes-ambiguity-34d0c2079bbf', source: 'Medium', date: '2026-02-07', topic: 'Delivery and commercials', excerpt: 'Fixed-bid projects don’t fail because they are fixed. They struggle when ambiguity is priced optimistically.' }
  ];

  // New posts from the feeds get a topic from their title; anything unmatched is filed under Essays.
  function guessTopic(t) {
    t = String(t || '').toLowerCase();
    if (/bid|margin|metric|estimat|scope|budget|pricing|invoice|utili[sz]|capacity|delivery|rework|iteration/.test(t)) return 'Delivery and commercials';
    if (/program|programme|leader|stakeholder|meeting|team|manager|pm\b|decision|risk|govern/.test(t)) return 'Program leadership';
    return 'Essays';
  }

  var list = document.getElementById('all-writing');
  var items = ARCHIVE.slice();
  var topic = 'all', order = 'new';
  var esc = function (s) { var t = document.createElement('span'); t.textContent = s == null ? '' : String(s); return t.innerHTML; };
  var fmt = function (d) { return d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; };
  var key = function (u) { return String(u).split('?')[0].replace(/\/$/, '').split('/').pop(); };
  try { var v = localStorage.getItem('writing-view'); if (v === 'grid' || v === 'list') list.setAttribute('data-view', v); } catch (e) {}

  function draw() {
    var shown = items.filter(function (p) { return topic === 'all' || p.topic === topic; });
    shown.sort(function (a, b) { var c = (b.date || '').localeCompare(a.date || ''); return order === 'new' ? c : -c; });
    list.innerHTML = shown.length ? shown.map(function (p) {
      return '<li><a href="' + esc(p.url) + '" target="_blank" rel="noopener">' +
        '<span class="wr-meta"><span class="wr-topic">' + esc(p.topic) + '</span><span class="wr-date">' + esc(fmt(p.date)) + (p.date ? ' · ' : '') + esc(p.source) + '</span></span>' +
        '<span class="wr-body"><span class="wr-title">' + esc(p.title) + ' <span class="wr-ext" aria-hidden="true">↗</span></span>' +
        (p.excerpt ? '<span class="wr-excerpt">' + esc(p.excerpt) + '</span>' : '') + '</span></a></li>';
    }).join('') : '<li class="empty">Nothing here yet. New posts appear automatically.</li>';
  }

  document.querySelectorAll('.wr-tabs [role="tab"]').forEach(function (b, i, all) {
    b.addEventListener('click', function () {
      topic = b.getAttribute('data-t');
      all.forEach(function (c) { c.setAttribute('aria-selected', String(c === b)); });
      draw();
    });
  });
  var sortBtn = document.querySelector('.wr-sort');
  sortBtn.addEventListener('click', function () {
    order = order === 'new' ? 'old' : 'new';
    sortBtn.setAttribute('data-sort', order);
    sortBtn.firstChild.nodeValue = order === 'new' ? 'Newest ' : 'Oldest ';
    draw();
  });
  document.querySelectorAll('.wr-view button').forEach(function (b, i, all) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === list.getAttribute('data-view')));
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-v');
      list.setAttribute('data-view', v);
      all.forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); });
      try { localStorage.setItem('writing-view', v); } catch (e) {}
    });
  });

  draw();

  fetch('/api/writing?limit=50').then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
    if (!data || !data.items) return;
    var byKey = {};
    items.forEach(function (p) { byKey[key(p.url)] = p; });
    data.items.forEach(function (p) {
      var k = key(p.url), have = byKey[k];
      if (have) { have.date = p.date || have.date; if (!have.excerpt && p.excerpt) have.excerpt = p.excerpt; }
      else { p.topic = guessTopic(p.title + ' ' + (p.categories || []).join(' ')); byKey[k] = p; items.push(p); }
    });
    draw();
  }).catch(function () {});
</script>
